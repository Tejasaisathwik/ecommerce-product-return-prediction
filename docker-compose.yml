version: '3.8'

services:
  ecommerce-return-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_return_prediction_service
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/best_model.joblib
      - METRICS_PATH=/app/models/metrics.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
